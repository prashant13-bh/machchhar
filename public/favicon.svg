<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1E2B58" />
      <stop offset="60%" stop-color="#111936" />
      <stop offset="100%" stop-color="#090E1E" />
    </radialGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="abdomenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle radar rings -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.16" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.14" stroke-dasharray="10 10" />
  <circle cx="256" cy="256" r="90" fill="#38BDF8" fill-opacity="0.06" />

  <!-- Crisp crescent moon -->
  <path d="M108 66 A34 34 0 1 0 148 112 A28 28 0 1 1 108 66 Z" fill="#FDE68A" opacity="0.92" />

  <!-- Stylized vector mosquito angled dynamically -->
  <g transform="translate(256 266) rotate(-14)">
    <!-- Back legs -->
    <g stroke="#090D1A" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-26 16 L-76 54 L-96 98" />
      <path d="M26 16 L76 54 L96 98" />
      <path d="M-32 -8 L-88 12 L-108 46" />
      <path d="M32 -8 L88 12 L108 46" />
    </g>
    <g stroke="#475569" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M-26 16 L-76 54 L-96 98" />
      <path d="M26 16 L76 54 L96 98" />
      <path d="M-32 -8 L-88 12 L-108 46" />
      <path d="M32 -8 L88 12 L108 46" />
    </g>

    <!-- Wings -->
    <g stroke="#090D1A" stroke-width="8">
      <ellipse cx="-68" cy="-42" rx="64" ry="26" transform="rotate(-24 -68 -42)" fill="url(#wingGrad)" />
      <ellipse cx="68" cy="-42" rx="64" ry="26" transform="rotate(24 68 -42)" fill="url(#wingGrad)" />
    </g>
    <path d="M-94 -50 Q-66 -43 -38 -31" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />
    <path d="M94 -50 Q66 -43 38 -31" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6" fill="none" />

    <!-- Abdomen -->
    <ellipse cx="0" cy="48" rx="32" ry="52" fill="url(#abdomenGrad)" stroke="#090D1A" stroke-width="9" />
    <path d="M-27 34 Q0 42 27 34" stroke="#090D1A" stroke-width="6" fill="none" opacity="0.55" />
    <path d="M-29 56 Q0 64 29 56" stroke="#090D1A" stroke-width="6" fill="none" opacity="0.55" />
    <path d="M-21 76 Q0 83 21 76" stroke="#090D1A" stroke-width="6" fill="none" opacity="0.55" />

    <!-- Thorax -->
    <ellipse cx="0" cy="-8" rx="34" ry="28" fill="url(#bodyGrad)" stroke="#090D1A" stroke-width="9" />

    <!-- Proboscis (needle) -->
    <path d="M0 -68 L0 -122" stroke="#090D1A" stroke-width="11" stroke-linecap="round" />
    <path d="M0 -68 L0 -122" stroke="#E2E8F0" stroke-width="4.5" stroke-linecap="round" />

    <!-- Head -->
    <circle cx="0" cy="-46" r="28" fill="url(#bodyGrad)" stroke="#090D1A" stroke-width="9" />

    <!-- Iconic Arcade Shades -->
    <rect x="-32" y="-60" width="28" height="20" rx="6" fill="#0EA5E9" stroke="#090D1A" stroke-width="6" />
    <rect x="4" y="-60" width="28" height="20" rx="6" fill="#0EA5E9" stroke="#090D1A" stroke-width="6" />
    <line x1="-4" y1="-51" x2="4" y2="-51" stroke="#090D1A" stroke-width="6" />
    <line x1="-25" y1="-54" x2="-13" y2="-54" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" />
    <line x1="11" y1="-54" x2="23" y2="-54" stroke="#E0F2FE" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Tactical Golden Crosshair Reticle -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="158" stroke="#090D1A" stroke-width="24" />
    <circle cx="256" cy="256" r="158" stroke="url(#ringGold)" stroke-width="14" />

    <!-- 4-way crosshair ticks -->
    <path d="M256 62 V120 M256 392 V450 M62 256 H120 M392 256 H450" stroke="#090D1A" stroke-width="24" />
    <path d="M256 62 V120 M256 392 V450 M62 256 H120 M392 256 H450" stroke="url(#ringGold)" stroke-width="14" />
  </g>

  <!-- Target Lock Spark -->
  <circle cx="256" cy="256" r="14" fill="#38BDF8" stroke="#090D1A" stroke-width="5" />
  <circle cx="256" cy="256" r="5" fill="#FFFFFF" />
</svg>
