<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090e1e" />
    <meta
      name="description"
      content="Machchhar: Raat ka Daaku — Protect Uncle's midnight sleep from buzzing &amp; singing mosquitoes!"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Machchhar: Raat ka Daaku</title>
    <style>
      html, body { background-color: #090e1e; margin: 0; }
    </style>
  </head>
  <body>
    <div id="app-loader" class="app-loader" role="status" aria-live="polite">
      <div class="loader-card">
        <div class="loader-emblem-wrap">
          <div class="loader-radar-ring"></div>
          <img class="loader-emblem" src="./icon-192.png" alt="Machchhar" width="88" height="88" />
        </div>
        <div class="loader-title">MACHCHHAR</div>
        <div class="loader-subtitle">RAAT KA DAAKU</div>
        <div class="loader-track" aria-hidden="true">
          <div id="loader-bar-fill" class="loader-fill"></div>
        </div>
        <div class="loader-meta">
          <span id="loader-status">Preparing midnight room...</span>
          <span id="loader-percent">0%</span>
        </div>
        <p id="loader-tip" class="loader-tip">Tip: Blast DJ Singers mid-song for an instant +300 MIC DROP!</p>
      </div>
    </div>

    <div id="app">
      <header id="desktop-topbar" class="desktop-bar" aria-label="Game Navigation">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" width="22" height="22" fill="none">
              <circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="2.4" />
              <circle cx="14" cy="14" r="3" fill="#e11d48" />
              <path d="M14 2v5M14 21v5M2 14h5M21 14h5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-text">
            <strong>MACHCHHAR</strong>
            <span>Raat ka Daaku</span>
          </div>
        </div>

        <nav class="top-nav-pills" aria-label="Quick Actions">
          <button id="top-nights-btn" class="nav-chip" type="button">Nights</button>
          <button id="top-endless-btn" class="nav-chip" type="button">Endless</button>
          <button id="top-guide-btn" class="nav-chip" type="button">Field Guide</button>
          <button id="top-badges-btn" class="nav-chip" type="button">Trophies</button>
        </nav>

        <div class="top-utility">
          <span id="top-coins-pill" class="top-stat-pill">0 Coins</span>
          <span id="top-best-pill" class="top-stat-pill">Best 0</span>
          <button id="desktop-theme-btn" class="top-icon-btn" type="button" title="Toggle Theme">Dark</button>
          <button id="desktop-fullscreen-btn" class="top-icon-btn" type="button" title="Fullscreen (F)">Full</button>
        </div>
      </header>

      <div id="desktop-shell">
        <main id="stage-frame">
          <canvas id="game-canvas"></canvas>
          <div id="ui-overlay"></div>
          <div id="achievement-toast" class="achievement-toast hidden" role="status" aria-live="polite"></div>
        </main>
      </div>

      <footer id="desktop-bottombar" class="desktop-bar desktop-footer">
        <div class="controls-strip">
          <span><kbd>Mouse</kbd> / <kbd>A</kbd><kbd>D</kbd> Aim</span>
          <span><kbd>Click</kbd> / <kbd>Space</kbd> Shoot</span>
          <span><kbd>R</kbd> Reload</span>
          <span><kbd>P</kbd> Pause</span>
          <span><kbd>M</kbd> Sound</span>
          <span><kbd>F</kbd> Fullscreen</span>
        </div>
        <div class="footer-links">
          <a href="./guide.html">Manual</a>
          <a href="./privacy.html">Privacy</a>
          <a href="./terms.html">Terms</a>
          <a href="./support.html">Support</a>
        </div>
      </footer>

      <div id="web-banner-slot" class="web-banner hidden" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
